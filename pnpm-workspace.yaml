packages:
  - discord
  - shared/*

catalog:
  "@discordjs/rest": 2.6.3
  "@earendil-works/pi-ai": 0.87.1
  "@flue/cli": 2.0.3
  "@flue/runtime": 2.0.3
  "@t3-oss/env-core": 0.13.11
  "@types/node": 24.13.3
  discord-api-types: 0.38.53
  oxfmt: 0.67.0
  oxlint: 1.82.0
  typescript: 7.0.2
  valibot: 1.4.2
  vitest: 4.1.11

overrides:
  # `@flue/runtime` pins `@earendil-works/pi-ai ^0.83.0`, whose bundled
  # OpenRouter catalog predates GPT-6 Luna. Force the catalog version that
  # bundles `openai/gpt-6-luna` so the default model resolves.
  "@earendil-works/pi-ai": 0.87.1

allowBuilds:
  "@google/genai": false
  core-js-pure: false
  esbuild: true
  protobufjs: false

minimumReleaseAge: 10080
# GPT-6 Luna first appears in `@earendil-works/pi-ai` 0.87.1 (and its new
# `pi-telemetry` peer), released 2026-09-22 — inside the 7-day age window.
# Exempt the two packages until that release matures so the default model
# resolves, rather than pinning to a stale catalog (GPT-5.6 Luna).
minimumReleaseAgeExclude:
  - "@earendil-works/pi-ai@0.87.1"
  - "@earendil-works/pi-telemetry@0.87.1"
saveExact: true
